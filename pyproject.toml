[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrap-python"
version = "0.1.0"
description = "用 Pydantic 模型描述 Bootstrap 5 界面，并渲染成 HTML"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bootstrap-python contributors" }]
keywords = ["bootstrap", "bootstrap5", "pydantic", "html", "ui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Pydantic",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "pydantic>=2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bootstrap_ui*"]

[tool.setuptools.package-data]
bootstrap_ui = ["py.typed", "templates/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
